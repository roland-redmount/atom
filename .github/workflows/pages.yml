# CLAUDE: Build the web front end and the documentation site, and publish the site with
# GitHub Pages. Requires Settings -> Pages -> Source to be "GitHub Actions".
name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# CLAUDE: one publish at a time; a publish already running is allowed to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CLAUDE: the same Emscripten version as the local build
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CLAUDE: a Debug build stops the session at a failed ASSERT(), rather than
      # carrying on with undefined behaviour
      - name: Build the web front end
        run: |
          emcmake cmake -B build/wasm -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/wasm -j4

      - name: Build the site
        run: |
          pip install -r docs/requirements.txt
          python docs/build.py --atom build/wasm/web --out build/site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
